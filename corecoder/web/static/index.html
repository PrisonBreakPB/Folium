<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folium</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #fafaf8;
  --surface: #f0efe9;
  --border: #e0dfd6;
  --text: #2c2c2a;
  --text-muted: #8a8a82;
  --accent: #4a7c59;
  --accent-hover: #3a6a49;
  --sidebar-bg: #eae9e2;
  --input-bg: #ffffff;
}

body {
  font-family: 'Georgia', 'Noto Serif SC', serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: row;
}

/* ── sidebar ────────────────────── */
.sidebar {
  width: 240px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 20px 16px 12px;
}
.sidebar-header .brand {
  font-size: 22px;
  font-weight: normal;
  color: var(--accent);
  letter-spacing: 2px;
}
.sidebar-header .brand-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
  font-family: system-ui, sans-serif;
}

.new-btn {
  display: block;
  width: calc(100% - 32px);
  margin: 8px 16px;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px;
  font-size: 13px;
  font-family: system-ui, sans-serif;
  cursor: pointer;
  border-radius: 4px;
  text-align: center;
  transition: all 0.2s;
}
.new-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

.conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 16px 16px;
}

.conv-item {
  padding: 10px 12px;
  margin-bottom: 2px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: background 0.2s;
  font-family: system-ui, sans-serif;
}
.conv-item:hover { background: var(--surface); }
.conv-item.active { background: var(--surface); color: var(--accent); }
.conv-item .conv-preview {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text-muted); font-size: 12px; margin-top: 3px;
}
.conv-item .conv-time { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

.conv-item .delete-btn {
  float: right;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
}
.conv-item:hover .delete-btn { opacity: 1; }
.conv-item .delete-btn:hover { color: #c44; }

/* ── main area ──────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--bg);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar .session-label {
  font-size: 12px;
  color: var(--text-muted);
  font-family: system-ui, sans-serif;
}

.cmd-bar {
  display: flex;
  gap: 6px;
  margin-left: auto;
}
.cmd-bar button {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 4px 12px;
  font-size: 12px;
  font-family: system-ui, sans-serif;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
}
.cmd-bar button:hover { color: var(--text); border-color: var(--text-muted); }

/* ── messages ───────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.msg {
  max-width: 75%;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-radius: 12px 12px 4px 12px;
  font-family: system-ui, sans-serif;
}
.msg.assistant {
  align-self: flex-start;
  background: var(--surface);
  color: var(--text);
  border-radius: 12px 12px 12px 4px;
}
.msg.system {
  align-self: center;
  background: transparent;
  color: var(--text-muted);
  font-size: 13px;
  font-family: system-ui, sans-serif;
  border: 1px dashed var(--border);
  padding: 8px 16px;
  border-radius: 8px;
}

.tool-tag {
  display: inline-block;
  background: var(--bg);
  color: var(--accent);
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 3px;
  margin-top: 8px;
  font-family: system-ui, sans-serif;
  border: 1px solid var(--border);
}

/* ── input area ─────────────────── */
.input-area {
  background: var(--bg);
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}
.input-area textarea {
  flex: 1;
  background: var(--input-bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-size: 15px;
  font-family: 'Georgia', 'Noto Serif SC', serif;
  resize: none;
  min-height: 44px;
  max-height: 120px;
  outline: none;
  transition: border-color 0.2s;
}
.input-area textarea:focus { border-color: var(--accent); }
.input-area button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 12px 24px;
  font-size: 14px;
  cursor: pointer;
  border-radius: 8px;
  white-space: nowrap;
  font-family: system-ui, sans-serif;
  transition: background 0.2s;
}
.input-area button:hover { background: var(--accent-hover); }
.input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="brand">Folium</div>
    <div class="brand-sub" id="modelInfo"></div>
  </div>
  <button class="new-btn" onclick="newConversation()">+ New conversation</button>
  <div class="conv-list" id="convList"></div>
</div>

<div class="main">
  <div class="topbar">
    <span class="session-label" id="sessionId"></span>
    <div class="cmd-bar">
      <button onclick="sendCmd('/help')">Help</button>
      <button onclick="sendCmd('/tokens')">Tokens</button>
      <button onclick="sendCmd('/compact')">Compact</button>
      <button onclick="sendCmd('/diff')">Diff</button>
      <button onclick="sendCmd('/save')">Save</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <textarea id="input" placeholder="Ask anything..." rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const convListEl = document.getElementById('convList');
const sessionIdEl = document.getElementById('sessionId');
let busy = false;

// ── init ──────────────────────────────────
async function init() {
  const resp = await fetch('/command', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({command: '/model'})
  });
  const data = await resp.json();
  document.getElementById('modelInfo').textContent = data.result;
  loadConversations();
}

// ── conversation list ────────────────────────
async function loadConversations() {
  const resp = await fetch('/conversations');
  const data = await resp.json();
  const current = data.current;
  sessionIdEl.textContent = current ? current : 'New conversation';

  convListEl.innerHTML = '';
  for (const s of data.sessions) {
    const div = document.createElement('div');
    div.className = 'conv-item' + (s.id === current ? ' active' : '');
    div.innerHTML = `
      <span class="delete-btn" onclick="deleteConv('${s.id}', event)">&#x2715;</span>
      ${s.preview || '(Empty)'}
      <div class="conv-time">${s.updated_at}</div>
    `;
    div.onclick = () => switchConv(s.id);
    convListEl.appendChild(div);
  }
}

async function newConversation() {
  if (busy) return;
  const resp = await fetch('/new', {method: 'POST'});
  messagesEl.innerHTML = '';
  loadConversations();
}

async function switchConv(id) {
  if (busy) return;
  const resp = await fetch('/switch', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: id})
  });
  if (!resp.ok) { alert('Switch failed'); return; }
  const data = await resp.json();

  messagesEl.innerHTML = '';
  for (const m of data.messages) {
    const role = m.role;
    const content = m.content || '';
    if (role === 'user') {
      appendMsg('user', content);
    } else if (role === 'assistant' && content) {
      appendMsg('assistant', content);
    } else if (role === 'tool') {
      appendMsg('system', '[tool result] ' + content.slice(0, 100));
    }
  }
  loadConversations();
}

async function deleteConv(id, event) {
  event.stopPropagation();
  if (!confirm('Delete this conversation?')) return;
  const resp = await fetch('/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: id})
  });
  loadConversations();
}

// ── input ────────────────────────────────────
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ── messages ─────────────────────────────────
function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// ── send message ─────────────────────────────
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  busy = true;
  sendBtn.disabled = true;

  appendMsg('user', text);
  const assistantDiv = appendMsg('assistant', '');

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });

    if (!resp.ok) {
      const err = await resp.json();
      assistantDiv.textContent = err.error || 'Request failed';
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const lines = part.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const event = JSON.parse(line.slice(6));

          if (event.type === 'token') {
            assistantDiv.textContent += event.content;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (event.type === 'tool') {
            const tag = document.createElement('div');
            tag.className = 'tool-tag';
            const brief = Object.entries(event.kwargs)
              .map(([k,v]) => k + '=' + String(v).slice(0,30))
              .join(', ');
            tag.textContent = '> ' + event.name + '(' + brief + ')';
            assistantDiv.appendChild(tag);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (event.type === 'error') {
            assistantDiv.textContent += '\n❌ ' + event.content;
          }
        }
      }
    }

    loadConversations();
  } catch (e) {
    assistantDiv.textContent += '\n❌ Connection error: ' + e.message;
  } finally {
    busy = false;
    sendBtn.disabled = false;
  }
}

// ── commands ─────────────────────────────────
async function sendCmd(cmd) {
  if (busy) return;
  try {
    const resp = await fetch('/command', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: cmd})
    });
    const data = await resp.json();
    appendMsg('system', data.result);
    if (cmd.startsWith('/model ') || cmd === '/model') {
      document.getElementById('modelInfo').textContent = data.result;
    }
  } catch (e) {
    appendMsg('system', '❌ ' + e.message);
  }
}

init();
</script>
</body>
</html>
