<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==== Cobalt theme for Folium WebUI ====
   Hallmark · genre: modern-minimal · theme: Cobalt
   Cool engineered paper · one electric-cobalt signal · hairline structure · Space Grotesk + Inter + JetBrains Mono */
:root {
  /* paper & ink (cool, hue ~250-258) */
  --bg: oklch(98.5% 0.004 250);
  --surface: oklch(99.5% 0.003 250);
  --surface-soft: oklch(95.5% 0.006 252);
  --surface-sunken: oklch(93% 0.008 252);
  --sidebar-bg: oklch(96.5% 0.005 251);
  --code-bg: oklch(95% 0.008 252);
  --graphite: oklch(23% 0.016 260);
  --graphite-ink: oklch(92% 0.008 258);

  /* hairlines do the work */
  --border: oklch(89% 0.012 255);
  --border-strong: oklch(76% 0.016 255);

  /* ink */
  --text: oklch(24% 0.02 258);
  --text-muted: oklch(40% 0.018 257);
  --text-faint: oklch(55% 0.02 257);

  /* one cobalt signal */
  --accent: oklch(58% 0.20 256);
  --accent-hover: oklch(50% 0.20 256);
  --accent-ink: oklch(98% 0 0);
  --accent-soft: oklch(95% 0.05 256);
  --accent-border: oklch(79% 0.09 256);

  --warning: oklch(58% 0.12 70);
  --warning-bg: oklch(97.5% 0.02 90);
  --error: oklch(50% 0.16 27);
  --error-bg: oklch(97% 0.02 30);
  --error-border: oklch(86% 0.05 27);

  /* type */
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  /* space (4pt) */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;

  /* text scale */
  --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-md: 15px;
  --text-lg: 17px; --text-xl: 21px; --text-2xl: 26px;

  /* technical radii */
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 12px;

  /* elevation — barely there, borders do the work */
  --shadow-sm: 0 1px 2px oklch(24% 0.02 258 / 0.05);
  --shadow-md: 0 8px 24px oklch(24% 0.03 258 / 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-x: clip; height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.55;
  display: flex;
  min-height: 100vh;
}

button { font-family: inherit; cursor: pointer; }

/* ============ sidebar ============ */
.sidebar {
  width: 248px;
  flex: 0 0 248px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: var(--space-4) var(--space-3);
  gap: var(--space-2);
  min-height: 100vh;
}
.sidebar-header { margin-bottom: var(--space-2); }
.brand {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 19px;
  letter-spacing: 0.01em;
  color: var(--text);
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.02em;
  margin-top: 2px;
}
.new-btn {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin: var(--space-2) 0 var(--space-3);
  transition: border-color .15s, color .15s;
}
.new-btn:hover { border-color: var(--accent); color: var(--accent); }

.conv-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.conv-item {
  position: relative;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: var(--text-sm);
  color: var(--text-muted);
  cursor: pointer;
  transition: background .12s, color .12s;
}
.conv-item:hover { background: var(--surface-soft); color: var(--text); }
.conv-item.active { background: var(--surface); border-color: var(--border); color: var(--text); }
.conv-title { font-weight: 500; margin-right: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-time {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.02em;
}
.delete-btn {
  position: absolute; top: 6px; right: 6px;
  width: 20px; height: 20px; line-height: 1;
  border: 1px solid transparent; border-radius: 4px;
  background: transparent; color: var(--text-faint);
  font-size: 14px; opacity: 0;
  transition: opacity .12s, color .12s, border-color .12s;
}
.conv-item:hover .delete-btn { opacity: 1; }
.delete-btn:hover { color: var(--error); border-color: var(--error-border); }

/* ============ main ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }

/* topbar */
.topbar {
  display: flex; align-items: center; gap: var(--space-4);
  padding: 0 var(--space-5);
  height: 50px;
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.session-label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.02em;
}
.cmd-bar { margin-left: auto; display: flex; gap: 6px; }
.cmd-bar button {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  transition: color .12s, border-color .12s, background .12s;
}
.cmd-bar button:hover { color: var(--accent); border-color: var(--accent-border); }

/* usage panel */
.usage-panel {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--border);
  background: var(--surface-soft);
}
.usage-block h3, .usage-title { font-size: 12px; }
.usage-title {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: var(--space-2);
}
.usage-title span:last-child { font-size: var(--text-sm); color: var(--text); }
.usage-meter {
  position: relative; height: 5px;
  background: var(--border);
  border-radius: 999px; overflow: hidden;
}
.usage-meter-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width .3s; }
.usage-meter-reserve { position: absolute; top: 0; bottom: 0; background: var(--error); }
.usage-sub {
  margin-top: var(--space-1);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
}
.usage-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
.usage-metric-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-faint);
}
.usage-metric-value { font-size: var(--text-md); font-weight: 600; color: var(--text); }
.usage-metric-value[data-accent="true"] { color: var(--accent); }
.usage-metric-value.warn { color: oklch(70% 0.16 85); }
.usage-metric-value.exhausted { color: oklch(58% 0.20 27); }

/* todo panel */
.todo-panel {
  display: none;
  padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  margin: 0 0 0 var(--space-1);
}
.todo-panel.visible { display: block; }
.todo-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--space-2);
}
.todo-items { display: flex; flex-direction: column; gap: 2px; }
.todo-item {
  display: flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-sm); color: var(--text-muted);
  padding: 2px 0;
}
.todo-marker { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
.todo-item.completed { color: var(--text-faint); text-decoration: line-through; }
.todo-item.completed .todo-marker { color: var(--accent); }
.todo-item.in_progress .todo-marker { color: var(--accent); }
.todo-progress {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
}

/* ============ messages ============ */
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: var(--space-6) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.msg { max-width: 100%; line-height: 1.6; }
.msg.user {
  align-self: flex-end;
  max-width: 85%;
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  color: var(--text);
  font-size: var(--text-base);
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.assistant, .msg.system { align-self: stretch; font-size: var(--text-base); color: var(--text); }

/* markdown content inside assistant messages */
.msg h2, .msg h3, .msg h4 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
  margin: var(--space-4) 0 var(--space-2);
}
.msg h2 { font-size: 18px; }
.msg h3 { font-size: 16px; }
.msg h4 { font-size: 14.5px; }
.msg p { margin: 6px 0; }
.msg ul, .msg ol { margin: 6px 0 6px 20px; padding-left: 0; }
.msg li { margin: 3px 0; }
.msg strong { font-weight: 600; color: var(--text); }
.msg em { font-style: italic; }
.msg a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.msg code {
  font-family: var(--font-mono);
  font-size: 0.86em;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 1px 5px;
  border-radius: 4px;
}
.msg pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  margin: var(--space-3) 0;
  overflow-x: auto;
}
.msg pre code {
  background: transparent;
  color: var(--text);
  padding: 0;
  font-size: 12.5px;
  line-height: 1.6;
  display: block;
  white-space: pre;
}

/* tables */
.table-wrap { overflow-x: auto; margin: var(--space-3) 0; }
.table-wrap table {
  border-collapse: collapse;
  width: 100%;
  font-size: var(--text-sm);
  background: var(--surface);
  border: 1px solid var(--border);
}
.table-wrap th {
  text-align: left;
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text); background: var(--surface-soft);
}
.table-wrap th, .table-wrap td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.table-wrap tr:last-child td { border-bottom: none; }
.table-wrap td { color: var(--text-muted); }

/* ============ process / tool trace ============ */
.msg.process { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0; overflow: hidden; background: var(--surface); }
.process-header { display: flex; align-items: center; gap: var(--space-2); padding: 8px 14px; }
.process-count { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.03em; color: var(--text-faint); }
.summary, .msg.process summary {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.02em;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
}
.msg.process summary { padding: 8px 14px; border-bottom: 1px solid var(--border); }

.tool-entry { padding: 8px 14px; }
.tool-entry + .tool-entry, .tool-entry[style*="display: block"] { border-top: 1px solid var(--border); }
.tool-line { display: flex; align-items: center; gap: var(--space-2); }
.status-chip {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
}
.status-chip[data-status="ok"], .tool-entry:not(.error):not(.running) .status-chip { color: var(--accent); border-color: var(--accent-border); }
.tool-entry.error .status-chip { color: var(--error); border-color: var(--error-border); background: var(--error-bg); }
.tool-entry.running .status-chip { color: var(--warning); border-color: oklch(80% 0.09 70); background: var(--warning-bg); }
.tool-name { font-weight: 500; font-size: var(--text-sm); color: var(--text); }
.tool-status { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
.tool-block { padding: 8px 14px; }
.tool-block-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 4px;
}
.tool-preview {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 260px; overflow-y: auto;
}
.tool-entry.error .tool-name { color: var(--error); }
.tool-actions { display: flex; gap: 6px; margin-top: 6px; }
.tool-copy, .tool-toggle {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.03em;
  color: var(--text-faint);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
}
.tool-copy:hover, .tool-toggle:hover { color: var(--accent); border-color: var(--accent-border); }

/* ============ input ============ */
.input-area {
  border-top: 1px solid var(--border);
  padding: var(--space-4) var(--space-5);
  background: var(--bg);
  display: flex; align-items: flex-end; gap: var(--space-3);
}
.input-wrapper { flex: 1; display: flex; flex-direction: column; gap: var(--space-2); }
.mode-bar { display: flex; gap: 4px; }
.mode-bar button {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-faint);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 12px;
}
.mode-bar button.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
#input {
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 11px 14px;
  resize: none;
  line-height: 1.45;
  outline: none;
  transition: border-color .15s;
  max-height: 180px;
}
#input:focus { border-color: var(--accent); }
#input::placeholder { color: var(--text-faint); }
#sendBtn {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--accent-ink);
  background: var(--accent);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  padding: 0 18px;
  height: 42px;
  transition: background .15s;
}
#sendBtn:hover { background: var(--accent-hover); }
#sendBtn:disabled { background: var(--border); color: var(--text-faint); cursor: default; }

/* skill autocomplete */
.skill-autocomplete {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  z-index: 10;
}
.skill-autocomplete.visible { display: block; }
.skill-item { padding: 8px 14px; cursor: pointer; }
.skill-item.active, .skill-item:hover { background: var(--accent-soft); }
.skill-item-name { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); letter-spacing: 0.02em; }
.skill-item-desc { font-size: var(--text-sm); color: var(--text-muted); }

/* ============ approval ============ */
.approval-panel {
  display: none;
  position: fixed;
  right: var(--space-5); bottom: var(--space-5);
  width: 560px; max-width: calc(100vw - 32px);
  max-height: 70vh;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  z-index: 50;
  flex-direction: column;
  overflow: hidden;
}
.approval-panel.visible { display: flex; }
.approval-head {
  display: flex; align-items: center; gap: var(--space-3);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-soft);
}
.approval-title { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; color: var(--text); }
.approval-path {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.01em;
  margin-top: 2px;
}
.approval-tag {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-border);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 2px 8px;
}
.approval-content { display: flex; gap: var(--space-4); padding: 0; min-height: 0; }
.approval-files {
  width: 200px;
  border-right: 1px solid var(--border);
  padding: var(--space-2);
  display: flex; flex-direction: column; gap: 2px;
  overflow-y: auto;
}
.approval-file {
  display: flex; justify-content: space-between; align-items: center;
  gap: 6px; text-align: left;
  font-size: var(--text-sm);
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 7px 9px;
}
.approval-file.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--text); }
.approval-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.approval-file-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); white-space: nowrap; }
.approval-diff-wrap { flex: 1; min-width: 0; padding: var(--space-3); overflow-y: auto; }
.approval-diff {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-muted);
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  white-space: pre-wrap;
  word-break: break-word;
}
.approval-load {
  margin-top: var(--space-2);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
}
.approval-load:hover { background: var(--accent-soft); }
.approval-feedback { padding: 0 var(--space-4) var(--space-3); }
.approval-feedback label { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 4px; }
.approval-feedback textarea {
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  resize: vertical;
  outline: none;
}
.approval-feedback textarea:focus { border-color: var(--accent); }
.approval-foot {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface-soft);
}
.approval-note { font-size: var(--text-sm); color: var(--text-faint); margin-right: auto; }
.approval-btn {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
}
.approval-btn:hover { border-color: var(--text); color: var(--text); }
.approval-btn.danger {
  color: var(--error);
  border-color: var(--error-border);
  background: var(--error-bg);
}
.approval-btn.danger:hover { background: var(--error-bg); border-color: var(--error); }
.approval-btn.primary {
  color: var(--accent-ink);
  background: var(--accent);
  border-color: transparent;
}
.approval-btn.primary:hover { background: var(--accent-hover); }
.approval-btn[hidden] { display: none; }

/* focus visibility */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============ responsive ============ */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .usage-panel { grid-template-columns: 1fr; }
  .usage-historical { display: none; }
  .approval-panel { left: var(--space-4); right: var(--space-4); width: auto; }
  .approval-content { flex-direction: column; }
  .approval-files { width: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .msg.user { max-width: 100%; }
}
</style>

</head>
<body>
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="brand">Folium</div>
    <div class="brand-sub" id="modelInfo"></div>
  </div>
  <button class="new-btn" onclick="newConversation()">新建对话</button>
  <div class="conv-list" id="convList"></div>
</aside>

<main class="main">
  <div class="topbar">
    <span class="session-label" id="sessionId"></span>
    <div class="cmd-bar">
      <button onclick="sendCmd('/help')">帮助</button>
      <button onclick="sendCmd('/skills')">Skills</button>
      <button onclick="sendCmd('/tokens')">Token 用量</button>
      <button onclick="sendCmd('/compact')">压缩上下文</button>
    </div>
  </div>

  <section class="usage-panel" aria-label="Token and cost usage">
    <div class="usage-block">
      <div class="usage-title">
        <span>上下文窗口占用</span>
        <span id="contextPercent">0%</span>
      </div>
      <div class="usage-meter">
        <div class="usage-meter-fill" id="contextFill"></div>
        <div class="usage-meter-reserve" id="contextReserve"></div>
      </div>
      <div class="usage-sub" id="contextText">0 / 0 tokens</div>
    </div>
    <div class="usage-block">
      <div class="usage-title">
        <span>本轮用量</span>
      </div>
      <div class="usage-metrics usage-metrics-wide">
        <div class="usage-metric">
          <div class="usage-metric-label">输入</div>
          <div class="usage-metric-value" id="lastPromptTokens">--</div>
        </div>
        <div class="usage-metric">
          <div class="usage-metric-label">输出</div>
          <div class="usage-metric-value" id="lastCompletionTokens">--</div>
        </div>
        <div class="usage-metric">
          <div class="usage-metric-label">缓存</div>
          <div class="usage-metric-value" id="lastCachedTokens">--</div>
        </div>
      </div>
    </div>
    <div class="usage-block">
      <div class="usage-title">
        <span>会话累计</span>
      </div>
      <div class="usage-metrics usage-metrics-wide">
        <div class="usage-metric">
          <div class="usage-metric-label">总计</div>
          <div class="usage-metric-value" id="cumulativeTokens">--</div>
        </div>
        <div class="usage-metric">
          <div class="usage-metric-label">费用</div>
          <div class="usage-metric-value" id="statsCost">--</div>
        </div>
        <div class="usage-metric">
          <div class="usage-metric-label">命中率</div>
          <div class="usage-metric-value" id="statsHitRate">--</div>
        </div>
      </div>
    </div>
  </section>

  <section class="todo-panel" id="todoPanel" aria-label="Todo status">
    <div class="todo-title">Tasks</div>
    <div class="todo-items" id="todoItems"></div>
    <div class="todo-progress" id="todoProgress"></div>
  </section>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="input-wrapper" id="inputWrapper">
      <div class="mode-bar" id="modeBar">
        <button id="modeBuildBtn" class="active" onclick="setMode('build')">Build</button>
        <button id="modePlanBtn" onclick="setMode('plan')">Plan</button>
      </div>
      <div class="skill-autocomplete" id="skillAutocomplete"></div>
      <textarea id="input" placeholder="输入你的科研任务、代码问题或实验想法..." rows="1"></textarea>
    </div>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</main>

<section class="approval-panel" id="approvalPanel" aria-live="polite">
  <div class="approval-head">
    <div>
      <div class="approval-title" id="approvalTitle">审查文件改动</div>
      <div class="approval-path" id="approvalPath"></div>
    </div>
    <div class="approval-tag" id="approvalTool">write_file</div>
  </div>
  <div class="approval-content">
    <div class="approval-files" id="approvalFiles"></div>
    <div class="approval-diff-wrap">
      <pre class="approval-diff" id="approvalDiff"></pre>
      <button class="approval-load" id="approvalLoadDiff" type="button" hidden>加载更多 diff</button>
    </div>
  </div>
  <div class="approval-feedback" id="approvalFeedbackWrap" hidden>
    <label for="approvalFeedback">修改要求</label>
    <textarea id="approvalFeedback" placeholder="说明希望如何调整这次变更"></textarea>
  </div>
  <div class="approval-foot">
    <div class="approval-note" id="approvalNote">只有你同意后，文件才会被修改。</div>
    <button class="approval-btn danger" id="approvalDenyBtn" type="button">拒绝本次变更</button>
    <button class="approval-btn" id="approvalReviseBtn" type="button" hidden>要求修改</button>
    <button class="approval-btn primary" id="approvalAllowBtn" type="button">确认应用全部变更</button>
  </div>
</section>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const convListEl = document.getElementById('convList');
const sessionIdEl = document.getElementById('sessionId');
const todoPanelEl = document.getElementById('todoPanel');
const todoItemsEl = document.getElementById('todoItems');
const todoProgressEl = document.getElementById('todoProgress');
const approvalPanelEl = document.getElementById('approvalPanel');
const approvalTitleEl = document.getElementById('approvalTitle');
const approvalPathEl = document.getElementById('approvalPath');
const approvalToolEl = document.getElementById('approvalTool');
const approvalFilesEl = document.getElementById('approvalFiles');
const approvalDiffEl = document.getElementById('approvalDiff');
const approvalLoadDiffBtn = document.getElementById('approvalLoadDiff');
const approvalNoteEl = document.getElementById('approvalNote');
const approvalFeedbackWrapEl = document.getElementById('approvalFeedbackWrap');
const approvalFeedbackEl = document.getElementById('approvalFeedback');
const approvalAllowBtn = document.getElementById('approvalAllowBtn');
const approvalDenyBtn = document.getElementById('approvalDenyBtn');
const approvalReviseBtn = document.getElementById('approvalReviseBtn');
let busy = false;
let activeApproval = null;
const DEFAULT_MAX_CONTEXT_TOKENS = 1000000;
const DEFAULT_RESERVED_OUTPUT_TOKENS = 20000;
let usageState = emptyUsageState();
let availableSkills = [];
let skillAutocompleteIndex = -1;

const STATUS_LABELS = {
  ok: '完成',
  running: '运行中',
  error: '错误',
  bad_arguments: '参数错误',
  timeout: '超时'
};

const KNOWN_MOJIBAKE = [
  ['寮€濮嬪鐞嗚姹?', '开始处理请求'],
  ['鐢熸垚鏈€缁堝洖澶?', '生成最终回复'],
  ['杩炵画宸ュ叿鍙傛暟閿欒锛屽凡鍋滄浠诲姟', '连续工具参数错误，已停止任务'],
  ['璇锋眰澶辫触', '请求失败'],
  ['杩炴帴閿欒', '连接错误'],
  ['閳?', '[警告]'],
  ['閴?', '[错误]'],
  ['鉂?', '[错误]']
];

async function init() {
  try {
    const resp = await fetch('/command', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: '/model'})
    });
    const data = await resp.json();
    document.getElementById('modelInfo').textContent = normalizeText(data.result);
  } catch (e) {
    document.getElementById('modelInfo').textContent = '模型信息加载失败';
  }
  loadSkills();
  loadConversations();
  refreshMode();
  refreshTodos();
  updateUsagePanel();
}

let currentMode = 'build';

function applyMode(mode) {
  currentMode = mode;
  const buildBtn = document.getElementById('modeBuildBtn');
  const planBtn = document.getElementById('modePlanBtn');
  const wrapper = document.getElementById('inputWrapper');
  buildBtn.classList.toggle('active', mode === 'build');
  planBtn.classList.toggle('active', mode === 'plan');
  planBtn.classList.toggle('plan', mode === 'plan');
  wrapper.classList.toggle('is-plan', mode === 'plan');
  const inputEl = document.getElementById('input');
  if (inputEl) {
    inputEl.placeholder = mode === 'plan'
      ? 'Plan 模式：描述你想调研的问题，agent 只做调研和规划，不改文件...'
      : '输入你的科研任务、代码问题或实验想法...';
  }
}

async function refreshMode() {
  try {
    const resp = await fetch('/mode');
    const data = await resp.json();
    if (data.mode) applyMode(data.mode);
  } catch (e) {}
}

async function setMode(mode) {
  if (mode === currentMode) return;
  const prevMode = currentMode;
  applyMode(mode);
  try {
    const resp = await fetch('/mode', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mode: mode})
    });
    if (resp.status === 409) {
      applyMode(prevMode);
      appendMsg('system', 'Agent 正在执行，请稍后再切换模式。');
      return;
    }
    const data = await resp.json();
    if (data.error) {
      applyMode(prevMode);
      appendMsg('system', `[错误] ${data.error}`);
    }
  } catch (e) {
    applyMode(prevMode);
    appendMsg('system', `[错误] ${e.message}`);
  }
}

async function loadSkills() {
  try {
    const resp = await fetch('/skills');
    const data = await resp.json();
    availableSkills = data.skills || [];
  } catch (e) {
    availableSkills = [];
  }
}

async function loadConversations() {
  const resp = await fetch('/conversations');
  const data = await resp.json();
  const current = data.current;
  sessionIdEl.textContent = current || '新建对话';
  applyContextUpdate(data.context_budget, false);
  updateUsagePanel();
  if (data.mode) {
    applyMode(data.mode);
  }

  convListEl.innerHTML = '';
  for (const s of data.sessions) {
    const div = document.createElement('div');
    div.className = 'conv-item' + (s.id === current ? ' active' : '');

    const remove = document.createElement('button');
    remove.className = 'delete-btn';
    remove.type = 'button';
    remove.textContent = '×';
    remove.title = '删除对话';
    remove.onclick = (event) => deleteConv(s.id, event);

    const title = document.createElement('div');
    title.className = 'conv-title';
    title.textContent = normalizeText(s.preview || '(空对话)');

    const time = document.createElement('div');
    time.className = 'conv-time';
    time.textContent = s.updated_at || '';

    div.appendChild(remove);
    div.appendChild(title);
    div.appendChild(time);
    div.onclick = () => switchConv(s.id);
    convListEl.appendChild(div);
  }
}

async function newConversation() {
  if (busy) return;
  await fetch('/new', {method: 'POST'});
  messagesEl.innerHTML = '';
  renderTodos([]);
  resetUsage();
  loadConversations();
}

async function switchConv(id) {
  if (busy) return;
  const resp = await fetch('/switch', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: id})
  });
  if (!resp.ok) {
    alert('切换失败');
    return;
  }
  const data = await resp.json();

  messagesEl.innerHTML = '';
  resetUsage();
  applyContextUpdate(data.context_budget, false);
  applySessionStats(data.stats);
  let pendingTools = [];
  const toolNames = new Map();
  const flushTools = () => {
    if (!pendingTools.length) return;
    appendHistoryTools(pendingTools);
    pendingTools = [];
  };

  for (const m of data.messages) {
    const role = m.role;
    const content = normalizeText(m.content || '');
    if (role === 'user') {
      flushTools();
      appendMsg('user', content);
    } else if (role === 'assistant') {
      collectToolNames(m, toolNames);
      addHistoricalUsage(m._usage);
      if (content) {
        flushTools();
        appendMsg('assistant', content);
      }
    } else if (role === 'tool') {
      pendingTools.push({
        ...m,
        _toolName: m.name || toolNames.get(m.tool_call_id) || 'tool'
      });
    }
  }
  flushTools();
  updateUsagePanel();
  refreshTodos();
  loadConversations();
}

async function deleteConv(id, event) {
  event.stopPropagation();
  if (!confirm('确认删除这个对话吗？相关的本地持久化记录和执行 trace 也会一起删除。')) return;
  const resp = await fetch('/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: id})
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    alert(err.error || '删除失败');
    return;
  }
  const data = await resp.json();
  if (data.deleted_current) {
    messagesEl.innerHTML = '';
    renderTodos([]);
  }
  loadConversations();
}

async function refreshTodos() {
  try {
    const resp = await fetch('/todos');
    if (!resp.ok) return;
    const data = await resp.json();
    renderTodos(data.items || []);
  } catch (e) {
    renderTodos([]);
  }
}

function renderTodos(items) {
  const todos = Array.isArray(items) ? items : [];
  todoItemsEl.innerHTML = '';
  if (!todos.length) {
    todoPanelEl.classList.remove('visible');
    todoProgressEl.textContent = '';
    return;
  }

  for (const item of todos) {
    const status = String(item.status || 'pending');
    const chip = document.createElement('div');
    chip.className = `todo-item ${status}`;

    const marker = document.createElement('span');
    marker.className = 'todo-marker';
    marker.textContent = status === 'completed' ? '✓' : status === 'in_progress' ? '>' : '·';

    const text = document.createElement('span');
    text.className = 'todo-text';
    text.textContent = normalizeText(item.text || '');
    text.title = normalizeText(item.text || '');

    chip.appendChild(marker);
    chip.appendChild(text);
    todoItemsEl.appendChild(chip);
  }

  const completed = todos.filter(item => item.status === 'completed').length;
  todoProgressEl.textContent = `${completed}/${todos.length}`;
  todoPanelEl.classList.add('visible');
}

inputEl.addEventListener('keydown', e => {
  const ac = document.getElementById('skillAutocomplete');
  if (ac.classList.contains('visible')) {
    const items = ac.querySelectorAll('.skill-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      skillAutocompleteIndex = Math.min(skillAutocompleteIndex + 1, items.length - 1);
      updateAutocompleteSelection(items);
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      skillAutocompleteIndex = Math.max(skillAutocompleteIndex - 1, 0);
      updateAutocompleteSelection(items);
      return;
    }
    if (e.key === 'Enter' && skillAutocompleteIndex >= 0) {
      e.preventDefault();
      selectSkill(items[skillAutocompleteIndex].dataset.name);
      return;
    }
    if (e.key === 'Escape') {
      hideAutocomplete();
      return;
    }
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 128) + 'px';
  handleSkillAutocomplete();
});

function handleSkillAutocomplete() {
  const text = inputEl.value;
  const match = text.match(/^\/([\w-]*)/);
  if (match) {
    const query = match[1].toLowerCase();
    const matches = availableSkills.filter(s => s.name.toLowerCase().includes(query));
    if (matches.length > 0) {
      showAutocomplete(matches);
    } else {
      hideAutocomplete();
    }
  } else {
    hideAutocomplete();
  }
}

function showAutocomplete(skills) {
  const ac = document.getElementById('skillAutocomplete');
  ac.innerHTML = skills.map((s, i) => `
    <div class="skill-item${i === 0 ? ' active' : ''}" data-name="${s.name}">
      <div class="skill-item-name">/${s.name}</div>
      <div class="skill-item-desc">${s.description}</div>
    </div>
  `).join('');
  ac.classList.add('visible');
  skillAutocompleteIndex = 0;

  ac.querySelectorAll('.skill-item').forEach(item => {
    item.addEventListener('click', () => selectSkill(item.dataset.name));
    item.addEventListener('mouseenter', () => {
      ac.querySelectorAll('.skill-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      skillAutocompleteIndex = [...ac.querySelectorAll('.skill-item')].indexOf(item);
    });
  });
}

function hideAutocomplete() {
  const ac = document.getElementById('skillAutocomplete');
  ac.classList.remove('visible');
  skillAutocompleteIndex = -1;
}

function selectSkill(name) {
  const text = inputEl.value;
  const rest = text.replace(/^\/[\w-]*\s*/, '');
  inputEl.value = `/${name} ${rest}`;
  hideAutocomplete();
  inputEl.focus();
}

function updateAutocompleteSelection(items) {
  items.forEach((item, i) => {
    item.classList.toggle('active', i === skillAutocompleteIndex);
  });
  items[skillAutocompleteIndex]?.scrollIntoView({ block: 'nearest' });
}

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'assistant' || role === 'system') {
    div.innerHTML = renderMarkdown(normalizeText(text));
  } else {
    div.textContent = normalizeText(text);
  }
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function approvalFilesFromEvent(event) {
  if (Array.isArray(event.files) && event.files.length) {
    return event.files;
  }
  return [{
    index: 0,
    tool_call_id: event.tool_call_id,
    tool_name: event.tool_name,
    path: event.path || '',
    title: event.title || '审查文件改动',
    diff: event.diff || '',
    truncated: Boolean(event.truncated),
    diff_chars: event.diff_chars || 0,
    additions: event.additions || 0,
    deletions: event.deletions || 0
  }];
}

function approvalFileName(path) {
  const parts = String(path || '').split(/[\\/]/);
  return parts[parts.length - 1] || path || '未命名文件';
}

function currentApprovalFile() {
  if (!activeApproval) return null;
  return activeApproval.files[activeApproval.selectedFileIndex] || null;
}

function approvalDiffState(index) {
  const file = activeApproval.files[index];
  if (!activeApproval.diffStates[index]) {
    activeApproval.diffStates[index] = {
      text: file.diff || '',
      nextOffset: activeApproval.canLoadFull && file.truncated ? 0 : null
    };
  }
  return activeApproval.diffStates[index];
}

function renderApprovalFileList() {
  approvalFilesEl.replaceChildren();
  if (!activeApproval) return;
  activeApproval.files.forEach((file, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'approval-file' + (index === activeApproval.selectedFileIndex ? ' active' : '');
    button.title = normalizeText(file.path || '');

    const name = document.createElement('span');
    name.className = 'approval-file-name';
    name.textContent = normalizeText(approvalFileName(file.path));

    const count = document.createElement('span');
    count.className = 'approval-file-count';
    count.textContent = `+${file.additions || 0} -${file.deletions || 0}`;

    button.appendChild(name);
    button.appendChild(count);
    button.addEventListener('click', () => {
      activeApproval.selectedFileIndex = index;
      renderApprovalFileList();
      renderApprovalDiff();
    });
    approvalFilesEl.appendChild(button);
  });
}

function renderApprovalDiff() {
  const file = currentApprovalFile();
  if (!file) {
    approvalDiffEl.textContent = '';
    approvalLoadDiffBtn.hidden = true;
    return;
  }

  const state = approvalDiffState(activeApproval.selectedFileIndex);
  approvalPathEl.textContent = normalizeText(file.path || '');
  approvalPathEl.title = normalizeText(file.path || '');
  approvalDiffEl.textContent = normalizeToolText(state.text || '没有可显示的 diff');
  approvalLoadDiffBtn.hidden = state.nextOffset === null;
  approvalLoadDiffBtn.disabled = false;
  approvalLoadDiffBtn.textContent = state.nextOffset === 0 ? '加载完整 diff' : '加载更多 diff';

  if (file.truncated && state.nextOffset !== null) {
    approvalNoteEl.textContent = `当前显示 ${approvalFileName(file.path)} 的 diff 预览（共 ${file.diff_chars || 0} 个字符）。`;
  } else {
    approvalNoteEl.textContent = `确认后将一次性应用 ${activeApproval.files.length} 个文件的变更。`;
  }
}

function showApproval(event) {
  const files = approvalFilesFromEvent(event);
  activeApproval = {
    ...event,
    files,
    selectedFileIndex: 0,
    diffStates: {},
    canLoadFull: Array.isArray(event.files)
  };
  approvalTitleEl.textContent = files.length > 1
    ? `审查 ${files.length} 个受保护文件的变更`
    : normalizeText(event.title || files[0].title || '审查文件改动');
  approvalToolEl.textContent = files.length > 1
    ? 'change set'
    : normalizeText(files[0].tool_name || event.tool_name || 'edit');
  approvalAllowBtn.disabled = false;
  approvalDenyBtn.disabled = false;
  approvalReviseBtn.disabled = false;
  approvalFeedbackEl.value = '';
  const canRequestRevision = Array.isArray(event.files);
  approvalFeedbackWrapEl.hidden = !canRequestRevision;
  approvalReviseBtn.hidden = !canRequestRevision;
  renderApprovalFileList();
  renderApprovalDiff();
  approvalPanelEl.classList.add('visible');
}

function clearApproval() {
  activeApproval = null;
  approvalPanelEl.classList.remove('visible');
  approvalFilesEl.replaceChildren();
  approvalDiffEl.textContent = '';
  approvalLoadDiffBtn.hidden = true;
  approvalFeedbackWrapEl.hidden = true;
  approvalReviseBtn.hidden = true;
  approvalFeedbackEl.value = '';
}

async function loadMoreApprovalDiff() {
  if (!activeApproval || !activeApproval.canLoadFull) return;
  const index = activeApproval.selectedFileIndex;
  const state = approvalDiffState(index);
  if (state.nextOffset === null) return;

  approvalLoadDiffBtn.disabled = true;
  try {
    const params = new URLSearchParams({
      file_index: String(index),
      offset: String(state.nextOffset),
      limit: '30000'
    });
    const resp = await fetch(`/approval/${encodeURIComponent(activeApproval.approval_id)}/diff?${params}`);
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || '加载完整 diff 失败');
    }
    const data = await resp.json();
    state.text = state.nextOffset === 0 ? (data.diff || '') : state.text + (data.diff || '');
    state.nextOffset = data.next_offset;
    renderApprovalDiff();
  } catch (e) {
    approvalNoteEl.textContent = `加载 diff 失败：${e.message}`;
    approvalLoadDiffBtn.disabled = false;
  }
}

async function submitApproval(decision) {
  if (!activeApproval) return;
  const feedback = decision === 'revise' ? approvalFeedbackEl.value.trim() : '';
  if (decision === 'revise' && !feedback) {
    approvalNoteEl.textContent = '请填写修改要求后再提交。';
    approvalFeedbackEl.focus();
    return;
  }
  const approvalId = activeApproval.approval_id;
  approvalAllowBtn.disabled = true;
  approvalDenyBtn.disabled = true;
  approvalReviseBtn.disabled = true;
  const pendingText = {
    approve: '正在同意修改...',
    reject: '正在拒绝修改...',
    revise: '正在提交修改要求...'
  };
  approvalNoteEl.textContent = pendingText[decision] || '正在提交审批...';
  try {
    const resp = await fetch('/approval', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({approval_id: approvalId, decision, feedback})
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      const message = err.error === 'Approval request not found' || err.error === '审批请求不存在或已失效'
        ? '这条审批请求已经失效，可能是服务重启或已被处理。请让 Agent 重新发起操作。'
        : (err.error || '提交审批结果失败。');
      approvalNoteEl.textContent = message;
      approvalAllowBtn.disabled = false;
      approvalDenyBtn.disabled = false;
      approvalReviseBtn.disabled = false;
      return;
    }
    clearApproval();
  } catch (e) {
    approvalNoteEl.textContent = `连接失败：${e.message}`;
    approvalAllowBtn.disabled = false;
    approvalDenyBtn.disabled = false;
    approvalReviseBtn.disabled = false;
  }
}

approvalAllowBtn.addEventListener('click', () => submitApproval('approve'));
approvalDenyBtn.addEventListener('click', () => submitApproval('reject'));
approvalReviseBtn.addEventListener('click', () => submitApproval('revise'));
approvalLoadDiffBtn.addEventListener('click', loadMoreApprovalDiff);

function renderMarkdown(text) {
  if (!text) return '';
  let html = text
    // Escape HTML
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    // Tables (match header, separator, and body)
    .replace(/^(\|.+\|)\s*\n(\|[-\s|:]+\|)\s*\n((?:\|.+\|\s*\n?)+)/gm, function(match, header, sep, body) {
      const headers = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
      const rows = body.trim().split('\n').filter(r => r.trim()).map(row => {
        const cells = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
        return `<tr>${cells}</tr>`;
      }).join('');
      return `<div class="table-wrap"><table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
    })
    // Code blocks
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Bold
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    // Italic
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    // Headers
    .replace(/^### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    // Unordered lists
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    // Ordered lists
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // Line breaks
    .replace(/\n/g, '<br>');
  return html;
}

function ensureProcess(container) {
  if (!container.div) {
    container.div = document.createElement('div');
    container.div.className = 'msg process';

    const header = document.createElement('div');
    header.className = 'process-header';
    header.textContent = '模型过程';

    const count = document.createElement('span');
    count.className = 'process-count';
    count.textContent = '0 项';
    header.appendChild(count);

    container.body = document.createElement('div');
    container.countEl = count;
    container.itemCount = 0;
    container.div.appendChild(header);
    container.div.appendChild(container.body);
    messagesEl.appendChild(container.div);
  }
  return container.body;
}

function bumpProcessCount(container) {
  container.itemCount = (container.itemCount || 0) + 1;
  if (container.countEl) {
    container.countEl.textContent = `${container.itemCount} 项`;
  }
}

function appendStatus(container, text, kind = '') {
  const body = ensureProcess(container);
  const div = document.createElement('div');
  div.className = 'status-line' + (kind === 'error' ? ' error' : '');

  const dot = document.createElement('span');
  dot.className = 'status-dot';

  const content = document.createElement('span');
  content.textContent = normalizeStatus(text);

  div.appendChild(dot);
  div.appendChild(content);
  body.appendChild(div);
  bumpProcessCount(container);
  scrollToBottom();
}

function appendHistoryTools(messages) {
  const details = document.createElement('details');
  details.className = 'msg process history-tools';
  const errors = messages.filter(m => isToolError(m.content || '')).length;

  const summary = document.createElement('summary');
  summary.textContent = `历史工具过程：${messages.length} 次调用${errors ? `，${errors} 次异常` : ''}`;
  details.appendChild(summary);

  const body = document.createElement('div');
  const container = {div: details, body, silent: true};
  for (const m of messages) {
    const content = normalizeToolText(m.content || '');
    appendToolEntry(container, {
      type: isToolError(content) ? 'tool_error' : 'tool_result',
      name: m.name || m._toolName || 'tool',
      status: isToolError(content) ? 'error' : 'ok',
      preview: content.slice(0, 700),
      content
    });
  }
  details.appendChild(body);
  messagesEl.appendChild(details);
  scrollToBottom();
}

function collectToolNames(message, toolNames) {
  for (const tc of message.tool_calls || []) {
    const id = tc.id;
    const name = tc.name || (tc.function && tc.function.name);
    if (id && name) {
      toolNames.set(id, name);
    }
  }
}

function appendToolEntry(container, event) {
  const body = ensureProcess(container);
  const statusKey = event.status || (event.type === 'tool_start' ? 'running' : 'ok');
  const isError = event.type === 'tool_error' || !['ok', 'running'].includes(statusKey);

  const div = document.createElement('div');
  div.className = 'tool-entry' + (isError ? ' error' : '') + (statusKey === 'running' ? ' running' : '');

  const line = document.createElement('div');
  line.className = 'tool-line';

  const chip = document.createElement('span');
  chip.className = 'status-chip';
  chip.textContent = statusLabel(statusKey);

  const name = document.createElement('span');
  name.className = 'tool-name';
  name.textContent = event.name || 'tool';

  const status = document.createElement('span');
  status.className = 'tool-status';
  status.textContent = event.duration_ms !== undefined && event.duration_ms !== null
    ? `${event.duration_ms}ms`
    : '';

  line.appendChild(chip);
  line.appendChild(name);
  line.appendChild(status);
  div.appendChild(line);

  const inputText = normalizeToolText(event.arguments_preview || '');
  if (inputText) {
    appendToolBlock(div, '输入', inputText);
  }

  const previewText = normalizeToolText(event.preview || '');
  const contentText = normalizeToolText(event.content || '');
  const diffText = normalizeToolText(event.diff || '');
  const outputText = previewText || contentText;
  if (outputText) {
    appendToolBlock(div, isError ? '错误' : '结果', outputText);
  }

  if (diffText) {
    appendToolBlock(div, '\u53d8\u66f4', diffText);
  }

  if (!diffText && contentText && contentText !== previewText) {
    const full = createPreview(contentText);
    full.style.display = 'none';

    const actions = document.createElement('div');
    actions.className = 'tool-actions';

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'tool-toggle';
    toggle.textContent = '展开完整结果';
    toggle.onclick = () => {
      const show = full.style.display === 'none';
      full.style.display = show ? 'block' : 'none';
      toggle.textContent = show ? '收起完整结果' : '展开完整结果';
      scrollToBottom();
    };

    const copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'tool-copy';
    copy.textContent = '复制结果';
    copy.onclick = async () => {
      await navigator.clipboard.writeText(contentText);
      copy.textContent = '已复制';
      setTimeout(() => { copy.textContent = '复制结果'; }, 1200);
    };

    actions.appendChild(toggle);
    actions.appendChild(copy);
    div.appendChild(actions);
    div.appendChild(full);
  }

  body.appendChild(div);
  bumpProcessCount(container);
  if (!container.silent) {
    scrollToBottom();
  }
}

function appendToolBlock(parent, label, text) {
  const labelEl = document.createElement('div');
  labelEl.className = 'tool-block-label';
  labelEl.textContent = label;
  parent.appendChild(labelEl);
  parent.appendChild(createPreview(text));
}

function createPreview(text) {
  const preview = document.createElement('div');
  preview.className = 'tool-preview';
  preview.textContent = text;
  return preview;
}

function isToolError(text) {
  return /^Error\b|timed out|bad arguments|Traceback/i.test(text || '');
}

function normalizeToolText(text) {
  return normalizeText(text)
    .replace(/\x1b\[[0-9;?]*[ -/]*[@-~]/g, '')
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .trim();
}

function normalizeStatus(text) {
  let output = normalizeText(text || '处理中');
  output = output.replace(/妯″瀷鎺ㄧ悊绗\??\s*(\d+)\s*杞\??/g, '模型推理第 $1 轮');
  return output;
}

function normalizeText(text) {
  let output = String(text ?? '');
  for (const [bad, good] of KNOWN_MOJIBAKE) {
    output = output.split(bad).join(good);
  }
  return output;
}

function statusLabel(status) {
  return STATUS_LABELS[status] || status;
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function emptyUsageState() {
  return {
    turns: [],
    last: null,
    cumulativePrompt: 0,
    cumulativeCompletion: 0,
    cumulativeCached: 0,
    cumulativeCost: null,
    statsCost: null,
    statsHitRate: 0,
    estimatedContextTokens: 0,
    maxContextTokens: DEFAULT_MAX_CONTEXT_TOKENS,
    reservedOutputTokens: DEFAULT_RESERVED_OUTPUT_TOKENS,
    inputBudgetTokens: DEFAULT_MAX_CONTEXT_TOKENS - DEFAULT_RESERVED_OUTPUT_TOKENS,
    budget: null,
    budgetSpent: 0,
    budgetSoftRatio: 0.8,
    budgetSoftReached: false,
    budgetExhausted: false
  };
}

function resetUsage() {
  usageState = emptyUsageState();
  updateUsagePanel();
}

function normalizeUsage(raw) {
  if (!raw) return null;
  const prompt = numberOrZero(raw.prompt_tokens);
  const completion = numberOrZero(raw.completion_tokens);
  const total = numberOrZero(raw.total_tokens) || prompt + completion;
  return {
    model: raw.model || '',
    prompt_tokens: prompt,
    completion_tokens: completion,
    cached_tokens: numberOrZero(raw.cached_tokens),
    total_tokens: total,
    cost: numberOrNull(raw.cost),
    cumulative_prompt_tokens: numberOrZero(raw.cumulative_prompt_tokens),
    cumulative_completion_tokens: numberOrZero(raw.cumulative_completion_tokens),
    cumulative_total_tokens: numberOrZero(raw.cumulative_total_tokens),
    cumulative_cost: numberOrNull(raw.cumulative_cost),
    estimated_context_tokens: numberOrZero(raw.estimated_context_tokens),
    max_context_tokens: numberOrZero(raw.max_context_tokens),
    reserved_output_tokens: numberOrZero(raw.reserved_output_tokens),
    input_budget_tokens: numberOrZero(raw.input_budget_tokens)
  };
}

function applyUsageUpdate(raw) {
  const usage = normalizeUsage(raw);
  if (!usage) return;
  usageState.last = usage;
  usageState.turns.push(usage);
  usageState.cumulativePrompt = usage.cumulative_prompt_tokens || usageState.cumulativePrompt + usage.prompt_tokens;
  usageState.cumulativeCompletion = usage.cumulative_completion_tokens || usageState.cumulativeCompletion + usage.completion_tokens;
  usageState.cumulativeCached = usageState.cumulativeCached + usage.cached_tokens;
  usageState.cumulativeCost = usage.cumulative_cost ?? addCost(usageState.cumulativeCost, usage.cost);
  usageState.statsCost = null;
  usageState.statsHitRate = 0;
  applyContextUpdate(raw, false);
  updateUsagePanel();
}

function addHistoricalUsage(raw) {
  const usage = normalizeUsage(raw);
  if (!usage) return;
  usageState.turns.push(usage);
  usageState.last = usage;
  usageState.cumulativePrompt += usage.prompt_tokens;
  usageState.cumulativeCompletion += usage.completion_tokens;
  usageState.cumulativeCached += usage.cached_tokens;
  usageState.cumulativeCost = addCost(usageState.cumulativeCost, usage.cost);
  applyContextUpdate(raw, false);
}

function applyContextUpdate(raw, refresh = true) {
  const contextTokens = numberOrNull(raw?.estimated_context_tokens);
  const maxTokens = numberOrNull(raw?.max_context_tokens);
  const reservedTokens = numberOrNull(raw?.reserved_output_tokens);
  const inputBudgetTokens = numberOrNull(raw?.input_budget_tokens);
  if (contextTokens !== null) usageState.estimatedContextTokens = contextTokens;
  if (maxTokens !== null) usageState.maxContextTokens = maxTokens;
  if (reservedTokens !== null) usageState.reservedOutputTokens = reservedTokens;
  if (inputBudgetTokens !== null) usageState.inputBudgetTokens = inputBudgetTokens;
  const budgetUsd = numberOrNull(raw?.budget_usd);
  const budgetSpent = numberOrNull(raw?.budget_spent);
  const budgetSoftRatio = numberOrNull(raw?.budget_soft_ratio);
  if (budgetUsd !== null) usageState.budget = budgetUsd;
  if (budgetSpent !== null) usageState.budgetSpent = budgetSpent;
  if (budgetSoftRatio !== null) usageState.budgetSoftRatio = budgetSoftRatio;
  if (budgetUsd !== null) usageState.budgetExhausted = Boolean(raw?.budget_exhausted);
  if (budgetUsd !== null) usageState.budgetSoftReached = Boolean(raw?.budget_soft_reached);
  if (refresh) updateUsagePanel();
}

function addCost(current, next) {
  if (next === null || next === undefined) return current;
  return (current ?? 0) + next;
}

function numberOrZero(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function numberOrNull(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function updateUsagePanel() {
  const last = usageState.last;
  const total = usageState.cumulativePrompt + usageState.cumulativeCompletion;
  const maxContext = usageState.maxContextTokens;
  const context = usageState.estimatedContextTokens;
  const inputBudget = usageState.inputBudgetTokens || maxContext;
  const reservedOutput = usageState.reservedOutputTokens;
  const percent = inputBudget > 0 ? Math.min(100, context / inputBudget * 100) : 0;
  const reservePercent = maxContext > 0 ? Math.min(100, reservedOutput / maxContext * 100) : 0;

  setText('contextPercent', `${percent.toFixed(1)}%`);
  setText('contextText', maxContext > 0
    ? `${formatNumber(context)} / ${formatNumber(maxContext)} tokens`
    : `${formatNumber(context)} tokens`);
  document.getElementById('contextFill').style.width = `${percent}%`;
  document.getElementById('contextReserve').style.width = `${reservePercent}%`;

  setText('lastPromptTokens', last ? formatNumber(last.prompt_tokens) : '--');
  setText('lastCompletionTokens', last ? formatNumber(last.completion_tokens) : '--');
  setText('lastCachedTokens', last ? formatNumber(last.cached_tokens) : '--');

  setText('cumulativeTokens', formatNumber(total));
  updateSessionStatsFromUsage();
}

function updateSessionStatsFromUsage() {
  const prompt = usageState.cumulativePrompt;
  const cached = usageState.cumulativeCached;
  const hitRate = prompt > 0 ? cached / prompt : 0;
  setText('statsHitRate', `${(hitRate * 100).toFixed(1)}%`);
  const costEl = document.getElementById('statsCost');
  if (!costEl) return;
  const budget = usageState.budget;
  if (budget && budget > 0) {
    const spent = usageState.budgetSpent;
    costEl.textContent = `$${spent.toFixed(3)} / $${Number(budget).toFixed(3)}`;
    costEl.classList.toggle('warn', usageState.budgetSoftReached && !usageState.budgetExhausted);
    costEl.classList.toggle('exhausted', usageState.budgetExhausted);
  } else {
    costEl.textContent = formatCost(usageState.cumulativeCost);
    costEl.classList.remove('warn', 'exhausted');
  }
}

function applySessionStats(stats) {
  if (!stats) return;
  usageState.cumulativePrompt = numberOrZero(stats.prompt_tokens);
  usageState.cumulativeCompletion = numberOrZero(stats.completion_tokens);
  usageState.cumulativeCached = numberOrZero(stats.cached_tokens);
  usageState.cumulativeCost = numberOrNull(stats.cost);
  usageState.statsCost = numberOrNull(stats.cost);
  usageState.statsHitRate = numberOrZero(stats.cache_hit_rate);
}

function setText(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}



function formatNumber(value) {
  return Math.round(numberOrZero(value)).toLocaleString();
}

function formatCost(value) {
  if (value === null || value === undefined) return '--';
  return `$${Number(value).toFixed(6)}`;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  busy = true;
  sendBtn.disabled = true;

  appendMsg('user', text);
  let assistantDiv = null;
  let assistantRawText = '';
  let assistantRenderTimer = null;
  const process = {div: null, body: null};

  function ensureAssistant() {
    if (!assistantDiv) {
      assistantDiv = appendMsg('assistant', '');
    }
    return assistantDiv;
  }

  function renderAssistantNow() {
    if (assistantRenderTimer) {
      clearTimeout(assistantRenderTimer);
      assistantRenderTimer = null;
    }
    ensureAssistant().innerHTML = renderMarkdown(normalizeText(assistantRawText));
    scrollToBottom();
  }

  function scheduleAssistantRender() {
    if (assistantRenderTimer) return;
    assistantRenderTimer = setTimeout(renderAssistantNow, 50);
  }

  function appendAssistantMarkdown(text) {
    assistantRawText += text || '';
    scheduleAssistantRender();
  }

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      assistantRawText = err.error || 'Request failed';
      renderAssistantNow();
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const lines = part.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const event = JSON.parse(line.slice(6));

          if (event.type === 'token') {
            appendAssistantMarkdown(event.content);
          } else if (event.type === 'agent_status') {
            appendStatus(process, event.message || '处理中', event.status);
          } else if (event.type === 'context_compress') {
            appendStatus(process, `上下文压缩：${event.before_tokens} -> ${event.after_tokens} tokens`);
          } else if (event.type === 'context_update') {
            applyContextUpdate(event);
          } else if (event.type === 'usage_update') {
            applyUsageUpdate(event);
          } else if (event.type === 'todo_update') {
            renderTodos(event.items || []);
          } else if (event.type === 'todo_reminder') {
            appendStatus(process, 'Todo reminder sent');
          } else if (event.type === 'approval_request') {
            showApproval(event);
            appendStatus(process, `等待你审查：${event.title || event.path || event.tool_name}`);
          } else if (event.type === 'tool_start') {
            appendToolEntry(process, {
              type: 'tool_start',
              name: event.name,
              status: 'running',
              arguments_preview: event.arguments_preview || ''
            });
          } else if (event.type === 'tool_result' || event.type === 'tool_error') {
            appendToolEntry(process, event);
          } else if (event.type === 'tool') {
            const brief = Object.entries(event.kwargs || {})
              .map(([k, v]) => `${k}=${String(v).slice(0, 40)}`)
              .join(', ');
            appendToolEntry(process, {
              name: event.name,
              status: event.status || 'running',
              arguments_preview: brief
            });
          } else if (event.type === 'error') {
            appendAssistantMarkdown(`\n[Error] ${event.content || ''}`);
          }
        }
      }
    }

    renderAssistantNow();
    loadConversations();
  } catch (e) {
    appendAssistantMarkdown(`\n[Error] Connection error: ${e.message}`);
    renderAssistantNow();
  } finally {
    if (assistantRenderTimer) {
      clearTimeout(assistantRenderTimer);
    }
    busy = false;
    sendBtn.disabled = false;
  }
}

async function sendCmd(cmd) {
  if (busy) return;
  try {
    const resp = await fetch('/command', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: cmd})
    });
    const data = await resp.json();
    appendMsg('system', normalizeText(data.result || data.error || ''));
    if (cmd.startsWith('/model ') || cmd === '/model') {
      document.getElementById('modelInfo').textContent = normalizeText(data.result || '');
    }
  } catch (e) {
    appendMsg('system', `[错误] ${e.message}`);
  }
}
